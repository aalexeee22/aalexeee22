name: generate cheese snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cheese-snake.svg?color_snake=#8a5a2b&color_dots=#ebedf0,#ffe08a,#ffcc4d,#f5b014,#d48806
            dist/cheese-snake-dark.svg?palette=github-dark&color_snake=#c98b4f&color_dots=#161b22,#5c4a1a,#a07a1f,#d9a520,#ffcc4d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
