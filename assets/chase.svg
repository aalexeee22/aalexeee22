<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <style>
    text { font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; font-weight: 700; }
    .leg { transform-box: fill-box; transform-origin: 50% 0; animation: leg .26s ease-in-out infinite alternate; }
    .leg.b { animation-direction: alternate-reverse; }
    @keyframes leg { from { transform: rotate(38deg); } to { transform: rotate(-38deg); } }
    .bounce { animation: bounce .26s ease-in-out infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-7px); } }

    .mouse { animation: mouse 7s linear infinite; }
    @keyframes mouse {
      0% { transform: translate(-80px, 218px) scale(1); opacity: 1; }
      46% { transform: translate(800px, 216px) scale(1); opacity: 1; }
      52%, 100% { transform: translate(818px, 206px) scale(.15); opacity: 0; }
    }
    .cat { animation: cat 7s linear infinite; }
    @keyframes cat {
      0%, 6% { transform: translate(-230px, 218px); opacity: 1; }
      57.9% { transform: translate(705px, 218px); opacity: 1; }
      58%, 100% { transform: translate(705px, 218px); opacity: 0; }
    }
    .dizzy { animation: dizzy 7s linear infinite; }
    @keyframes dizzy {
      0%, 57.9% { opacity: 0; transform: scale(1, 1); }
      58% { opacity: 1; transform: scale(.75, 1.12); }
      62% { transform: scale(1.08, .94); }
      66%, 90% { opacity: 1; transform: scale(1, 1); }
      96%, 100% { opacity: 0; transform: scale(1, 1); }
    }
    .wob { animation: wob .5s ease-in-out infinite alternate; }
    @keyframes wob { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
    .stars { animation: stars 7s linear infinite; }
    @keyframes stars { 0%, 59% { opacity: 0; } 61%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bonk { transform-box: fill-box; transform-origin: center; animation: bonk 7s linear infinite; }
    @keyframes bonk {
      0%, 57.5% { opacity: 0; transform: scale(.2) rotate(-10deg); }
      59% { opacity: 1; transform: scale(1.3) rotate(-10deg); }
      62%, 72% { opacity: 1; transform: scale(1) rotate(-10deg); }
      78%, 100% { opacity: 0; transform: scale(1) rotate(-10deg); }
    }
    .peek { animation: peek 7s ease-in-out infinite; }
    @keyframes peek {
      0%, 62% { transform: translateY(45px); }
      67%, 88% { transform: translateY(0); }
      93%, 100% { transform: translateY(45px); }
    }
    .title { transform-box: fill-box; transform-origin: center; animation: tw 1.6s ease-in-out infinite alternate; }
    @keyframes tw { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5df"/><stop offset="1" stop-color="#f7dfb3"/>
    </linearGradient>
    <pattern id="paper" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="2.2" fill="#f0cf96"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="260" rx="24"/></clipPath>
    <clipPath id="hole"><path d="M790 214V184a30 30 0 0 1 60 0v30z"/></clipPath>
    <path id="star" d="M0-8 2-2.6 7.6-2.5 3.2.9 4.7 6.4 0 3.3-4.7 6.4-3.2.9-7.6-2.5-2-2.6z" fill="#ffd43b" stroke="#e08e0b" stroke-width="1.2"/>
    <g id="catTail">
      <path d="M-52-52C-84-60-78-104-100-110" fill="none" stroke="#6b7a92" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="catTorso">
      <ellipse cx="-8" cy="-46" rx="50" ry="25" fill="#7d8ca3"/>
      <ellipse cx="0" cy="-36" rx="32" ry="12" fill="#dfe5ee"/>
    </g>
    <g id="catHead">
      <path d="M28-96 32-128 52-104z" fill="#7d8ca3"/><path d="M33-101 35-120 46-105z" fill="#f2a5a0"/>
      <path d="M52-104 70-126 72-94z" fill="#7d8ca3"/><path d="M57-104 68-119 68-98z" fill="#f2a5a0"/>
      <circle cx="48" cy="-80" r="27" fill="#7d8ca3"/>
      <ellipse cx="64" cy="-70" rx="17" ry="12" fill="#f0f3f7"/>
      <ellipse cx="78" cy="-75" rx="4.5" ry="3.2" fill="#2b2b2b"/>
      <path d="M70-72h24M70-68l23 4M70-76l22-8" stroke="#2b2b2b" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <!-- room -->
    <rect width="900" height="260" fill="url(#wall)"/>
    <rect width="900" height="198" fill="url(#paper)"/>
    <rect y="198" width="900" height="16" fill="#c98b4f"/>
    <rect y="198" width="900" height="3" fill="#dba26a"/>
    <rect y="214" width="900" height="46" fill="#a86b3c"/>
    <path d="M0 236H900M120 214v22M380 214v22M640 214v22M250 236v24M520 236v24M780 236v24" stroke="#8f5a31" stroke-width="2"/>
    <path d="M790 214V184a30 30 0 0 1 60 0v30z" fill="#3b2314"/>
    <path d="M790 214V184a30 30 0 0 1 60 0v30" fill="none" stroke="#8a5a2b" stroke-width="4"/>

    <text class="title" x="450" y="62" text-anchor="middle" font-size="36" fill="#7a3e12">Hi, I'm Alexandra!</text>
    <text x="450" y="96" text-anchor="middle" font-size="18" fill="#a8652e">catch me if you can!</text>

    <!-- mouse laughing from the hole -->
    <g clip-path="url(#hole)">
      <g class="peek">
        <circle cx="808" cy="186" r="8" fill="#b5773d"/><circle cx="808" cy="186" r="4.5" fill="#f2a5a0"/>
        <circle cx="832" cy="186" r="8" fill="#b5773d"/><circle cx="832" cy="186" r="4.5" fill="#f2a5a0"/>
        <circle cx="820" cy="200" r="13" fill="#b5773d"/>
        <ellipse cx="820" cy="206" rx="7" ry="5" fill="#f3d6a8"/>
        <circle cx="820" cy="203" r="2.4" fill="#4a2a14"/>
        <ellipse cx="815" cy="195" rx="2.8" ry="3.6" fill="#fff"/><circle cx="815.5" cy="195.5" r="1.7" fill="#222"/>
        <path d="M822 195q3-3 6 0" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M814 209q6 5 12 0" fill="none" stroke="#4a2a14" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- running mouse with cheese -->
    <g class="mouse">
      <g class="bounce">
        <path d="M-20-16C-38-24-44-2-62-14" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
        <g class="leg b"><rect x="-13" y="-13" width="7" height="13" rx="3.5" fill="#8a5a2b"/></g>
        <g class="leg"><rect x="3" y="-13" width="7" height="13" rx="3.5" fill="#8a5a2b"/></g>
        <ellipse cx="-4" cy="-21" rx="18" ry="13" fill="#b5773d"/>
        <ellipse cx="1" cy="-18" rx="10" ry="7" fill="#f3d6a8"/>
        <circle cx="4" cy="-47" r="10.5" fill="#b5773d"/><circle cx="4" cy="-47" r="6.5" fill="#f2a5a0"/>
        <circle cx="14" cy="-35" r="12.5" fill="#b5773d"/>
        <ellipse cx="25" cy="-31" rx="8.5" ry="6" fill="#f3d6a8"/>
        <circle cx="33" cy="-32" r="2.8" fill="#4a2a14"/>
        <ellipse cx="19" cy="-39" rx="3.2" ry="4.2" fill="#fff"/><circle cx="20.5" cy="-39" r="2" fill="#222"/>
        <path d="M22-26q4 3 8 0" fill="none" stroke="#4a2a14" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M10-8h22v-14z" fill="#ffc93c" stroke="#e09f1f" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="27" cy="-12" r="2.2" fill="#e5a92a"/><circle cx="21" cy="-10" r="1.5" fill="#e5a92a"/>
        <ellipse cx="13" cy="-12" rx="4" ry="3.2" fill="#b5773d"/>
      </g>
    </g>

    <!-- running cat -->
    <g class="cat">
      <g class="bounce">
        <use href="#catTail"/>
        <g class="leg b"><rect x="-44" y="-34" width="13" height="34" rx="6.5" fill="#66748a"/></g>
        <g class="leg"><rect x="14" y="-34" width="13" height="34" rx="6.5" fill="#66748a"/></g>
        <use href="#catTorso"/>
        <g class="leg"><rect x="-30" y="-34" width="13" height="34" rx="6.5" fill="#7d8ca3"/></g>
        <g class="leg b"><rect x="26" y="-34" width="13" height="34" rx="6.5" fill="#7d8ca3"/></g>
        <use href="#catHead"/>
        <ellipse cx="52" cy="-88" rx="7" ry="9" fill="#fff" stroke="#2b2b2b" stroke-width="1.2"/>
        <ellipse cx="68" cy="-87" rx="6.5" ry="8.5" fill="#fff" stroke="#2b2b2b" stroke-width="1.2"/>
        <circle cx="56" cy="-86" r="3" fill="#1d1d1d"/><circle cx="71" cy="-85" r="3" fill="#1d1d1d"/>
        <path d="M44-100l14 6M76-100l-10 6" stroke="#2b2b2b" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M60-64q10 10 20 0z" fill="#9b2226"/>
        <path d="M63-64h3l-1.5 3zM74-64h3l-1.5 3z" fill="#fff"/>
      </g>
    </g>

    <!-- dizzy cat after hitting the wall -->
    <g transform="translate(705 218)">
      <g class="dizzy">
        <g class="wob">
          <use href="#catTail"/>
          <rect x="-44" y="-34" width="13" height="34" rx="6.5" fill="#66748a"/>
          <rect x="14" y="-34" width="13" height="34" rx="6.5" fill="#66748a"/>
          <use href="#catTorso"/>
          <rect x="-30" y="-34" width="13" height="34" rx="6.5" fill="#7d8ca3"/>
          <rect x="26" y="-34" width="13" height="34" rx="6.5" fill="#7d8ca3"/>
          <use href="#catHead"/>
          <ellipse cx="66" cy="-108" rx="8" ry="5" fill="#9aa8bd"/>
          <path d="M46-94l12 12M58-94l-12 12M62-93l11 11M73-93l-11 11" stroke="#2b2b2b" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M58-62q4-4 8 0t8 0t8 0" fill="none" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round"/>
          <path d="M70-61q3.5 9 7 0z" fill="#e5737a"/>
        </g>
      </g>
    </g>

    <g transform="translate(752 82)">
      <g class="stars">
        <g transform="scale(1 .4)">
          <g class="spin">
            <use href="#star" x="30" y="0"/>
            <use href="#star" x="-15" y="26"/>
            <use href="#star" x="-15" y="-26"/>
          </g>
        </g>
      </g>
    </g>
    <text class="bonk" x="800" y="64" text-anchor="middle" font-size="30" fill="#d9480f" stroke="#fff" stroke-width="1.5">BONK!</text>
  </g>
</svg>
