<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
  <style>
    .head { animation: head .32s ease-in-out infinite alternate; }
    @keyframes head { from { transform: rotate(-2deg); } to { transform: rotate(5deg); } }
    .cheek { transform-box: fill-box; transform-origin: center; animation: cheek .32s ease-in-out infinite alternate; }
    @keyframes cheek { from { transform: scale(.8); } to { transform: scale(1.2); } }
    .piece { transform-box: fill-box; transform-origin: center; animation: piece 6s ease-out infinite; }
    @keyframes piece {
      0%, 86% { transform: scale(1); }
      88% { transform: scale(0); }
      92% { transform: scale(1.15); }
      95%, 100% { transform: scale(1); }
    }
    .crumb { animation: crumb 1.2s ease-in infinite; }
    .crumb.d1 { animation-delay: .4s; }
    .crumb.d2 { animation-delay: .8s; }
    @keyframes crumb { from { transform: translateY(0); opacity: 1; } to { transform: translateY(22px); opacity: 0; } }
    .heart { opacity: 0; animation: heart 3s ease-out infinite; }
    .heart.d1 { animation-delay: 1.5s; }
    @keyframes heart {
      0% { opacity: 0; transform: translate(0, 6px) scale(.6); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(6px, -26px) scale(1); }
    }
  </style>
  <defs>
    <!-- bites appear right at the mouse's mouth, then the piece is replaced -->
    <mask id="bites" maskUnits="userSpaceOnUse" x="-100" y="-100" width="200" height="200">
      <rect x="-100" y="-100" width="200" height="200" fill="#fff"/>
      <circle cx="27" cy="-43" r="0" fill="#000"><animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;.12;.16;.88;.89;1" values="0;0;5;5;0;0"/></circle>
      <circle cx="31" cy="-41" r="0" fill="#000"><animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;.32;.36;.88;.89;1" values="0;0;6;6;0;0"/></circle>
      <circle cx="35" cy="-44" r="0" fill="#000"><animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;.52;.56;.88;.89;1" values="0;0;7;7;0;0"/></circle>
      <circle cx="39" cy="-41" r="0" fill="#000"><animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;.72;.76;.88;.89;1" values="0;0;7.5;7.5;0;0"/></circle>
    </mask>
    <path id="heart" d="M0 4C-7-1-4-8 0-4 4-8 7-1 0 4z" fill="#f28b8b"/>
  </defs>

  <ellipse cx="490" cy="140" rx="130" ry="5" fill="#000" opacity=".1"/>

  <!-- the rest of the cheese, waiting its turn -->
  <path d="M500 138H600V88z" fill="#ffc93c" stroke="#e09f1f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M600 138l20-10V78l-20 10z" fill="#f2b220" stroke="#e09f1f" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="575" cy="118" r="6" fill="#e5a92a"/>
  <circle cx="590" cy="102" r="4" fill="#e5a92a"/>
  <circle cx="548" cy="128" r="4" fill="#e5a92a"/>

  <!-- sitting mouse holding a piece of cheese -->
  <g transform="translate(420 140)">
    <path d="M-14-6C-42-2-50-24-36-34" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="-28" rx="18" ry="24" fill="#b5773d"/>
    <ellipse cx="5" cy="-24" rx="11" ry="16" fill="#f3d6a8"/>
    <ellipse cx="-6" cy="-3" rx="10" ry="4.5" fill="#8a5a2b"/>
    <ellipse cx="12" cy="-3" rx="10" ry="4.5" fill="#8a5a2b"/>

    <g transform="translate(8 -46)">
      <g class="head">
        <circle cx="8" cy="-27" r="9" fill="#a06a35"/><circle cx="8" cy="-27" r="5" fill="#f2a5a0"/>
        <circle cx="-6" cy="-25" r="11" fill="#b5773d"/><circle cx="-6" cy="-25" r="6.5" fill="#f2a5a0"/>
        <circle cx="4" cy="-10" r="14" fill="#b5773d"/>
        <ellipse cx="18" cy="-6" rx="10" ry="6.5" fill="#f3d6a8"/>
        <circle cx="28" cy="-7" r="3" fill="#4a2a14"/>
        <path d="M6-14q3.5-4 7 0" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
        <circle class="cheek" cx="11" cy="-3" r="3.6" fill="#f2a5a0" opacity=".7"/>
        <path d="M16 1q2 2 4 0q2 2 4 0" fill="none" stroke="#4a2a14" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M23-5l11-3M23-3l11 2" stroke="#8a5a2b" stroke-width=".9" stroke-linecap="round"/>
      </g>
    </g>

    <g mask="url(#bites)">
      <g class="piece">
        <path d="M26-42L48-50V-31z" fill="#ffc93c" stroke="#e09f1f" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="40" cy="-40" r="2.4" fill="#e5a92a"/>
        <circle cx="42" cy="-48" r="1.6" fill="#e5a92a"/>
      </g>
    </g>
    <path d="M6-34Q18-34 30-37M8-28Q22-26 40-33" fill="none" stroke="#b5773d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="31" cy="-37" r="3.6" fill="#b5773d"/>
    <circle cx="41" cy="-33" r="3.6" fill="#b5773d"/>
  </g>

  <rect class="crumb" x="447" y="98" width="3" height="3" fill="#ffc93c"/>
  <rect class="crumb d1" x="452" y="99" width="2.5" height="2.5" fill="#f2b220"/>
  <rect class="crumb d2" x="449" y="97" width="2" height="2" fill="#ffc93c"/>

  <use class="heart" href="#heart" x="418" y="46"/>
  <use class="heart d1" href="#heart" x="442" y="40"/>
</svg>
