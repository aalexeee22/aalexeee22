<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
  <style>
    text { font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; font-weight: 700; }
    .nib { animation: nib .35s ease-in-out infinite alternate; }
    @keyframes nib { from { transform: translate(0, 0); } to { transform: translate(3px, 3px); } }
    .chew { transform-box: fill-box; transform-origin: center; animation: chew .35s ease-in-out infinite alternate; }
    @keyframes chew { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
    .crumb { animation: crumb 1.2s ease-in infinite; }
    .crumb.d1 { animation-delay: .4s; }
    .crumb.d2 { animation-delay: .8s; }
    @keyframes crumb { from { transform: translateY(0); opacity: 1; } to { transform: translateY(30px); opacity: 0; } }
    .nom { opacity: 0; animation: nom 2.4s ease-out infinite; }
    .nom.d1 { animation-delay: 1.2s; }
    @keyframes nom {
      0% { opacity: 0; transform: translate(0, 8px); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(10px, -22px); }
    }
  </style>
  <defs>
    <mask id="eat" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="150">
      <rect width="900" height="150" fill="#fff"/>
      <circle cx="404" cy="132" r="0" fill="#000"><animate attributeName="r" dur="8s" repeatCount="indefinite" keyTimes="0;.08;.12;.88;.94;1" values="0;0;15;15;0;0"/></circle>
      <circle cx="426" cy="130" r="0" fill="#000"><animate attributeName="r" dur="8s" repeatCount="indefinite" keyTimes="0;.28;.32;.88;.94;1" values="0;0;17;17;0;0"/></circle>
      <circle cx="450" cy="128" r="0" fill="#000"><animate attributeName="r" dur="8s" repeatCount="indefinite" keyTimes="0;.48;.52;.88;.94;1" values="0;0;19;19;0;0"/></circle>
      <circle cx="476" cy="124" r="0" fill="#000"><animate attributeName="r" dur="8s" repeatCount="indefinite" keyTimes="0;.68;.72;.88;.94;1" values="0;0;21;21;0;0"/></circle>
    </mask>
  </defs>

  <ellipse cx="480" cy="140" rx="170" ry="6" fill="#000" opacity=".12"/>

  <!-- cheese wedge -->
  <g mask="url(#eat)">
    <path d="M400 138H570V72z" fill="#ffc93c" stroke="#e09f1f" stroke-width="2" stroke-linejoin="round"/>
    <path d="M570 138l28-14V60l-28 12z" fill="#f2b220" stroke="#e09f1f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="520" cy="115" r="7" fill="#e5a92a"/>
    <circle cx="550" cy="98" r="5" fill="#e5a92a"/>
    <circle cx="545" cy="128" r="4" fill="#e5a92a"/>
    <circle cx="490" cy="128" r="5" fill="#e5a92a"/>
    <circle cx="585" cy="100" r="5" fill="#d99a18"/>
  </g>

  <!-- sitting mouse -->
  <g transform="translate(360 140)">
    <path d="M-12-6C-40-2-50-22-38-34" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="0" cy="-26" rx="17" ry="22" fill="#b5773d"/>
    <ellipse cx="5" cy="-22" rx="10" ry="15" fill="#f3d6a8"/>
    <ellipse cx="-6" cy="-3" rx="10" ry="4.5" fill="#8a5a2b"/>
    <ellipse cx="12" cy="-3" rx="10" ry="4.5" fill="#8a5a2b"/>
    <g class="nib">
      <circle cx="2" cy="-72" r="11" fill="#b5773d"/><circle cx="2" cy="-72" r="6.5" fill="#f2a5a0"/>
      <circle cx="12" cy="-56" r="14" fill="#b5773d"/>
      <ellipse cx="26" cy="-52" rx="10" ry="6.5" fill="#f3d6a8"/>
      <circle cx="36" cy="-53" r="3" fill="#4a2a14"/>
      <ellipse cx="17" cy="-61" rx="3.4" ry="4.4" fill="#fff"/><circle cx="18.6" cy="-61" r="2.1" fill="#222"/>
      <circle cx="20" cy="-50" r="3.2" fill="#f2a5a0" opacity=".6"/>
      <ellipse class="chew" cx="29" cy="-46" rx="3.5" ry="2.5" fill="#4a2a14"/>
    </g>
    <path d="M8-32Q22-22 33-14" fill="none" stroke="#b5773d" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="34" cy="-13" r="3.6" fill="#b5773d"/>
  </g>

  <rect class="crumb" x="387" y="98" width="3" height="3" fill="#ffc93c"/>
  <rect class="crumb d1" x="393" y="100" width="2.5" height="2.5" fill="#f2b220"/>
  <rect class="crumb d2" x="390" y="97" width="2" height="2" fill="#ffc93c"/>

  <text class="nom" x="300" y="62" font-size="16" fill="#e09f1f">nom</text>
  <text class="nom d1" x="408" y="52" font-size="16" fill="#e09f1f">nom!</text>
</svg>
